services:
  postgres:
    image: postgres:15-alpine
    container_name: audiomuse-postgres
    env_file:
      - .env
      - .secrets
    ports:
      - 5432:5432
    volumes:
      - ./db/:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - audiomuse-net

  # AudioMuse-AI Flask application service
  audiomuse-ai-flask:
    image: ghcr.io/neptunehub/audiomuse-ai:pr-846-nvidia
    container_name: audiomuse-ai-flask-app
    ports:
      - 8000:8000
    env_file:
      - .env
      - .secrets
    volumes:
      - flask-audio:/app/temp_audio # Volume for temporary audio files
      - flask-plugins:/app/plugin/installed # This container's own plugins cache (code + pip deps)
    depends_on:
      - postgres
    restart: unless-stopped
    networks:
      - audiomuse-net
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]

  # AudioMuse-AI Queue Worker service
  audiomuse-ai-worker:
    image: ghcr.io/neptunehub/audiomuse-ai:pr-846-nvidia
    container_name: audiomuse-ai-worker-instance
    env_file:
      - .env
      - .secrets
    volumes:
      - worker-audio:/app/temp_audio # Volume for temporary audio files
      - worker-plugins:/app/plugin/installed # This container's own plugins cache (code + pip deps)
    depends_on:
      - postgres
    restart: unless-stopped
    networks:
      - audiomuse-net
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]

networks:
  audiomuse-net:
    name: audiomuse-net

# caches
volumes:
  flask-audio:
    name: flask-audio
  flask-plugins:
    name: flask-plugins
  worker-audio:
    name: worker-audio
  worker-plugins:
    name: worker-plugins

