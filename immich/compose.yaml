name: immich
services:
  immich-server:
    container_name: immich-server
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-release}
    # devices: # TODO: re-enable hardware-accelerated ML!
    #   - /dev/dri:/dev/dri
    volumes:
      # Do not edit the next line. If you want to change the media storage location on your system, edit the value of UPLOAD_LOCATION in the .env file
      - ${UPLOAD_LOCATION}:/usr/src/app/upload/:rw
      - /etc/localtime:/etc/localtime:ro
    env_file: .env
    #privileged: true
    #user: ${PUID}:${PGID}
    # expose:
    #   - 2283
    ports:
      - 2283:2283/tcp
    depends_on:
      immich-db:
        condition: service_healthy
        restart: true
      immich-redis:
        condition: service_healthy
        restart: true
    restart: always
    healthcheck:
      disable: false
    networks:
      - proxy-net
      - immich-net
    security_opt:
      # Prevent escalation of privileges after the container is started
      - no-new-privileges:true
    cap_drop:
      # Prevent access to raw network traffic
      - NET_RAW
  immich-ml:
    container_name: immich-ml
    # For hardware acceleration, add one of -[armnn, cuda, openvino] to the image tag.
    # Example tag: ${IMMICH_VERSION:-release}-cuda
    #image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-release}-openvino
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-release}
    device_cgroup_rules:
      - c 189:* rmw
    # devices:
    #   - /dev/dri:/dev/dri
    volumes:
      - /dev/bus/usb:/dev/bus/usb
      - immich_model-cache:/cache/:rw
    #user: ${PUID}:${PGID}
    env_file: .env
    restart: always
    healthcheck:
      disable: false
    networks:
      - immich-net
    security_opt:
      # Prevent escalation of privileges after the container is started
      - no-new-privileges:true
    cap_drop:
      # Prevent access to raw network traffic
      - NET_RAW
  immich-redis:
    container_name: immich-redis
    image: docker.io/redis:6.2-alpine@sha256:eaba718fecd1196d88533de7ba49bf903ad33664a92debb24660a922ecd9cac8
    healthcheck:
      test: redis-cli ping || exit 1
    restart: always
    networks:
      - immich-net
    env_file: .env
    #user: ${PUID}:${PGID}
    security_opt:
      # Prevent escalation of privileges after the container is started
      - no-new-privileges:true
    cap_drop:
      # Prevent access to raw network traffic
      - NET_RAW
  immich-db:
    container_name: immich-db
    image: docker.io/tensorchord/pgvecto-rs:pg14-v0.2.0@sha256:90724186f0a3517cf6914295b5ab410db9ce23190a2d9d0b9dd6463e3fa298f0
    env_file: .env
    #user: ${PUID}:${PGID}
    volumes:
      # Do not edit the next line. If you want to change the database storage location on your system, edit the value of DB_DATA_LOCATION in the .env file
      - immich_db:/var/lib/postgresql/data/:rw
    healthcheck:
      test: pg_isready --dbname='${DB_DATABASE_NAME}' --username='${DB_USERNAME}' ||
        exit 1; Chksum="$$(psql --dbname='${DB_DATABASE_NAME}'
        --username='${DB_USERNAME}' --tuples-only --no-align --command='SELECT
        COALESCE(SUM(checksum_failures), 0) FROM pg_stat_database')"; echo
        "checksum failure count is $$Chksum"; [ "$$Chksum" = '0' ] || exit 1
      interval: 5m
      # start_interval: 30s
      start_period: 5m
    command:
      - postgres
      - -c
      - shared_preload_libraries=vectors.so
      - -c
      - search_path="$$user", public, vectors
      - -c
      - logging_collector=on
      - -c
      - max_wal_size=2GB
      - -c
      - shared_buffers=512MB
      - -c
      - wal_compression=on
    restart: always
    networks:
      - immich-net
  # TODO: immich-backup:
  #   container_name: immich-backup
  #   image: prodrigestivill/postgres-backup-local:14
  #   restart: always
  #   env_file: .env
  #   environment:
  #     POSTGRES_HOST: immich-postgres
  #     POSTGRES_CLUSTER: "TRUE"
  #     POSTGRES_USER: ${DB_USERNAME}
  #     POSTGRES_PASSWORD: ${DB_PASSWORD}
  #     POSTGRES_DB: ${DB_DATABASE_NAME}
  #     SCHEDULE: "@daily"
  #     POSTGRES_EXTRA_OPTS: --clean --if-exists
  #     BACKUP_DIR: /db_dumps
  #   volumes:
  #     - /self-hosted/immich/db-dumps/:/db_dumps/:rw
  #   networks:
  #     - immich-net
  #   depends_on:
  #     immich-db:
  #       condition: service_healthy
  #       restart: true

networks:
  immich-net:
    name: immich-net
  proxy-net:
    external: true
volumes:
  immich_db:
    name: immich_db
    external: true
  immich_model-cache:
    name: immich_model-cache
    external: true
x-dockge:
  urls:
    - https://immich.samskeyti.net/
