services:
  tabby:
    image: ghcr.io/tabbyml/tabby:latest
    container_name: tabby
    command: >
      serve
      --device cpu
    ports:
      - "8080:8080/tcp"
    volumes:
      - data:/data/:rw
      - /docker/tabby/config/:/root/.tabby/:rw
    env_file: .env
    restart: unless-stopped

volumes:
  data:
