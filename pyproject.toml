[tool.poetry]
    name = "docker"
    version = "0.1.0"
    description = "Homelab Containers"
    authors = ["Dante Razo <github.d2brf@simplelogin.fr>"]
    readme = "README.md"
    package-mode = false

[tool.poetry.dependencies]
    python = ">=3.14"

    # common
    ruff = "*"

[[tool.poetry.source]]
    name = "pypi"
    priority = "primary"

[build-system]
    requires = ["poetry-core"]
    build-backend = "poetry.core.masonry.api"

[tool.ruff]
    line-length = 150
    exclude = [".git", ".venv"]
