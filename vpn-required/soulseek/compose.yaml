services:
  slskd:
    image: slskd/slskd:latest
    container_name: soulseek
    env_file: .env
    user: ${PUID}:${PGID}
    volumes:
      - soulseek_db:/app/data/:rw
      - /mnt/cold-pool/downloads/soulseek/downloads/:/app/downloads/:rw
      - /mnt/cold-pool/downloads/soulseek/incomplete/:/app/incomplete/:rw
      -./slskd.yml:/app/slskd.yml:rw
    restart: unless-stopped
    network_mode: container:gluetun # use VPN
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "1"

volumes:
  soulseek_db:
    name: soulseek_db
    external: true

x-dockge:
  urls:
    - https://soulseek.samskeyti.net/
