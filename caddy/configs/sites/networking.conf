id.samskeyti.net {
    import common
    reverse_proxy http://192.168.30.100:1411
}

stacks.samskeyti.net {
    import common
    reverse_proxy http://192.168.30.100:5002
}

agh.samskeyti.net {
	import common

	reverse_proxy {
		to http://192.168.30.200:3000 \
		   http://192.168.30.201:3000 \
		   http://192.168.30.202:3000

		lb_policy first
		lb_try_duration 10s
		lb_try_interval 250ms
		fail_duration 30s

		transport http {
			dial_timeout 2s
		}
	}
}

