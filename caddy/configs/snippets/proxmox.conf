# WebSocket + TLS-insecure transport
(proxmox.proxy) {
    import websockets

    transport http {
        tls_insecure_skip_verify
        tls_server_name {http.request.host}
    }
}

# round-robin backends, starting with cerulean
(proxmox.rr) {
	to https://192.168.10.43:8006
	#    https://192.168.10.42:8006
	#    https://192.168.10.46:8006

	lb_policy first
	lb_try_duration 10s
	lb_try_interval 250ms
	fail_duration 30s

	transport http {
		dial_timeout 2s
	}
}

# allow embedded console for Proxmox hosts
(proxmox.console) {
    @console host pve.samskeyti.net kex.samskeyti.net cerulean.samskeyti.net kvistur.samskeyti.net hoppipolla.samskeyti.net saeglopur.samskeyti.net pbs.samskeyti.net pbs2.samskeyti.net

    handle @console {
        header -x-frame-options
        header -content-security-policy
    }
}

# aggregate site-level import
(proxmox.agg) {
	import common
	import proxmox.console
}
