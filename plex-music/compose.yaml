services:
  plex-music:
    container_name: plex-music
    image: plexinc/pms-docker:latest
    restart: always
    ports:
      - 32400:32400/tcp
    env_file: .env
    cpus: "4.0"
    volumes:
      - plex-music_data:/config/:rw
      - backups_nfs:/backups/:rw
      - music_nfs:/media/music/:rw
      - audiobooks_nfs:/media/audiobooks/:rw
      - /dev/shm/plex-transcode/:/transcode/:rw
    networks:
      - plex-music-net
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "1"
  # TODO: add oauth2
  tautulli-music:
    container_name: tautulli
    image: lscr.io/linuxserver/tautulli:latest
    cpus: "1.0"
    env_file: .env
    volumes:
      - plex-music_data:/plex-data/:ro
      - tautulli-music_data:/config/:rw
#    user: ${PUID}:${PGID}
    ports:
      - 8181:8181/tcp
    restart: unless-stopped
    depends_on:
      - plex-music
    networks:
      - plex-music-net
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "1"

networks:
  plex-music-net:
    name: plex-music-net

volumes:
  plex-music_data:
    external: true
  tautulli-music_data:
    external: true
  music_nfs:
    driver: local
    driver_opts:
      type: "nfs"
      o: "addr=192.168.20.42,nolock,soft,rw,nfsvers=4"
      device: ":/tank/media/music/"
  audiobooks_nfs:
    driver: local
    driver_opts:
      type: "nfs"
      o: "addr=192.168.20.42,nolock,soft,rw,nfsvers=4"
      device: ":/tank/media/audiobooks/"
  backups_nfs:
    driver: local
    driver_opts:
      type: "nfs"
      o: "addr=192.168.20.42,nolock,soft,rw,nfsvers=4"
      device: ":/tank/backups/virtual-machines/plex-music/"

x-dockge:
  urls:
    - https://plexm.samskeyti.net/
