services:
  plex-music:
    container_name: plex-music
    image: lscr.io/linuxserver/plex:latest
    restart: unless-stopped
    ports:
      - 32400:32400/tcp
    env_file: .env
    volumes:
      - plex-music_data:/config/:rw
      - /backups/:/backups/:rw
      - /media/:/media/:rw
      - /dev/shm/plex-transcode/:/transcode/:rw
    networks:
      - plex-music-net
networks:
  plex-music-net:
    name: plex-music-net
volumes:
  plex-music_data:
    external: true
x-dockge:
  urls:
    - https://plexm.samskeyti.net/
