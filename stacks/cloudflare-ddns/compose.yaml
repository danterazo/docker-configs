services:
  cloudflare-ddns:
    container_name: cloudflare-ddns
    image: timothyjmiller/cloudflare-ddns:latest
    security_opt:
      - no-new-privileges:true
    network_mode: host # required for IPv6
    cpus: 0.5
    dns:
      - 1.1.1.1
      - 1.0.0.1
    env_file: .env
    volumes:
      - /self-hosted/cloudflare-ddns/config.json:/config.json
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "1"
