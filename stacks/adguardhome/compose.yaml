services:
  adguardhome:
    image: adguard/adguardhome:latest
    container_name: adguardhome
    restart: unless-stopped
    volumes:
      - adguardhome_ephemeral:/opt/adguardhome/work:rw
      - ./configs/:/opt/adguardhome/conf/:rw
    user: 1000:1000
    network_mode: host
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "1"

volumes:
  adguardhome_ephemeral:
    external: true
