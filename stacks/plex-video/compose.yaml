services:
  plex-video:
    container_name: plex-video
    image: plexinc/pms-docker:latest
    restart: unless-stopped
    ports:
      - 32400:32400/tcp
    env_file: .env
    volumes:
      - plex-video_data:/config/:rw
      - /mnt/hot-pool/backups/plex-video-vm/:/backups/:rw
      - /mnt/cold-pool/media/videos/plex/:/media/:rw
      - /dev/shm/plex-transcode/:/transcode/:rw
    runtime: nvidia
    networks:
      - plex-video-net
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "1"
  # TODO: add oauth2
  tautulli-video:
    image: lscr.io/linuxserver/tautulli:latest
    container_name: tautulli
    env_file: .env
    volumes:
      - plex-video_data:/plex-data/:ro
      - tautulli-video_data:/config/:rw
    ports:
      - 8181:8181/tcp
    restart: unless-stopped
    depends_on:
      - plex-video
    networks:
      - plex-video-net
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "1"


networks:
  plex-video-net:
    name: plex-video-net

volumes:
  plex-video_data:
    external: true
  tautulli-video_data:
    external: true

x-dockge:
  urls:
    - https://plexv.samskeyti.net/
