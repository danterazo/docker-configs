services:
  plex-video:
    container_name: plex-video
    image: lscr.io/linuxserver/plex:latest
    restart: unless-stopped
    ports:
      - 32400:32400/tcp
    env_file: .env
    volumes:
      - plex-video_data:/config/:rw
      - /ephemeral/backups/:/backups/:rw
      - /media/:/media/:rw
      - /dev/shm/plex-transcode/:/transcode/:rw
    runtime: nvidia
    networks:
      - plex-video-net
networks:
  plex-video-net:
    name: plex-video-net
volumes:
  plex-video_data:
    external: true
x-dockge:
  urls:
    - https://plexv.samskeyti.net/
