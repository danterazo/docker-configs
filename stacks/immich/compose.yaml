networks:
  immich-net:
    name: immich-net
volumes:
  immich_db:
    name: immich_db
    external: true
  immich_profile:
    name: immich_profile
    external: true
logging:
  driver: "json-file"
  options:
    max-size: "20m"
    max-file: "1"
x-dockge:
  urls:
    - https://immich.samskeyti.net/
