services:
  qbittorrent:
    image: linuxserver/qbittorrent:latest
    container_name: qbittorrent
    env_file:
      - .env
      - .secrets
    volumes:
      - qbittorrent_config:/config/qBittorrent/:rw
      - qbittorrent_ui:/ui/:rw
      - qbittorrent-working_nfs:/hot/:rw
      - qbittorrent-complete_nfs:/cold/:rw
    network_mode: container:gluetun # use VPN
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "1"

volumes:
  qbittorrent_config:
    name: qbittorrent_config
    external: true
  qbittorrent_ui:
    name: qbittorrent_ui
    external: true
  qbittorrent-working_nfs:
    driver: local
    driver_opts:
      type: "nfs"
      o: "addr=192.168.20.42,nolock,soft,rw,nfsvers=4"
      device: ":/mnt/zfs/hot-pool/downloads/qbittorrent/"
  qbittorrent-complete_nfs:
    driver: local
    driver_opts:
      type: "nfs"
      o: "addr=192.168.20.42,nolock,soft,rw,nfsvers=4"
      device: ":/mnt/zfs/cold-pool/downloads/qbittorrent/"

x-dockge:
  urls:
    - https://qb.samskeyti.net/
