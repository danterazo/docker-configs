services:
  slskd:
    image: slskd/slskd:latest
    container_name: soulseek
    env_file: .env
    user: ${PUID}:${PGID}
    volumes:
      - ./db/:/app/data/:rw
      - soulseek-active_nfs:/app/incomplete/:rw
      - soulseek-complete_nfs:/app/downloads/:rw
      - ./slskd.yml:/app/slskd.yml:rw
    restart: unless-stopped
    network_mode: container:gluetun # use VPN
    depends_on:
      gluetun:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "1"

volumes:
  soulseek-active_nfs:
    driver: local
    driver_opts:
      type: "nfs"
      o: "addr=192.168.20.42,nolock,soft,rw,nfsvers=4"
      device: ":/tank/downloads/soulseek/00-downloading/"
  soulseek-complete_nfs:
    driver: local
    driver_opts:
      type: "nfs"
      o: "addr=192.168.20.42,nolock,soft,rw,nfsvers=4"
      device: ":/tank/downloads/soulseek/01-complete/"

x-dockge:
  urls:
    - https://soulseek.samskeyti.net/
