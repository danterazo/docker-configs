services:
  qbittorrent:
    image: linuxserver/qbittorrent:latest
    container_name: qbittorrent
    env_file:
      - .env
      - .secrets
    volumes:
      - ./config/:/config/qBittorrent/:rw
      - ./ui/:/ui/:rw
      - qbittorrent_nfs:/downloads/:rw
    network_mode: container:gluetun # use VPN
    # depends_on:
    #   gluetun:
    #     condition: service_healthy
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:8090/api/v2/transfer/info | jq -e '.connection_status == \"connected\"' > /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  qbittorrent_nfs:
    driver: local
    driver_opts:
      type: nfs
      o: "addr=192.168.20.42,hard,rw,noatime,nfsvers=4,timeo=600,retrans=2"
      device: ":/tank/downloads/qbittorrent/"

x-dockge:
  urls:
    - https://qb.samskeyti.net/
