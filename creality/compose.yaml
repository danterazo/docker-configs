services:
  spoolman:
    image: ghcr.io/donkie/spoolman:latest
    container_name: spoolman
    restart: unless-stopped
    ports:
      - 7912:8000/tcp
    env_file: .env
    volumes:
      - ./spoolman/data/:/home/app/.local/share/spoolman/:rw
    networks:
      - creality-net

  timelapse-render:
    build:
      context: ./timelapse/
      dockerfile: Dockerfile
    image: timelapse-render:local
    container_name: timelapse-render
    restart: unless-stopped
    ports:
      - 8095:8095/tcp
    env_file: .env
    volumes:
      - timelapse_nfs:/data:rw
    security_opt:
      - no-new-privileges:true
    networks:
      - creality-net

networks:
  creality-net:
    name: creality-net

volumes:
  timelapse_nfs:
    driver: local
    driver_opts:
      type: nfs
      o: "addr=192.168.20.42,rw,noatime,nfsvers=4,soft"
      device: ":/tank/printing/timelapse/"
