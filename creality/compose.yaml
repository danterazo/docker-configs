services:
  spoolman:
    image: ghcr.io/donkie/spoolman:latest
    container_name: spoolman
    restart: unless-stopped
    ports:
      - "7912:8000"
    env_file: .env
    volumes:
      - ./spoolman/data/:/home/app/.local/share/spoolman/:rw
  
  timelapse:
    image: jrottenberg/ffmpeg:7.1-alpine
    container_name: timelapse
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command: >
      apk add --no-cache inotify-tools &&
      while true; do
        sleep 3600;
      done
    env_file: .env
    volumes:
      - ./timelapse/frames/:/data/incoming/:ro
      - ./timelapse/rendered/:/data/rendered/:rw
      - ./timelapse/state/:/state/:rw
    security_opt:
      - no-new-privileges:true
