name: creality

services:
  fluidd:
    image: ghcr.io/fluidd-core/fluidd:latest
    container_name: fluidd
    restart: unless-stopped
    ports:
      - "4408:80"
    volumes:
      - ./fluid/config/:/usr/share/nginx/html/config/:rw
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    security_opt:
      - no-new-privileges:true

  timelapse:
    image: jrottenberg/ffmpeg:7.1-alpine
    container_name: timelapse
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command: >
      apk add --no-cache inotify-tools &&
      while true; do
        sleep 3600;
      done
    environment:
      TZ: America/Chicago
    volumes:
      - ./timelapse/frames/:/data/incoming/:ro
      - ./timelapse/rendered/:/data/rendered/:rw
      - ./timelapse/state/:/state/:rw
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=1g
