services:
  spoolman:
    image: ghcr.io/donkie/spoolman:latest
    container_name: spoolman
    restart: unless-stopped
    ports:
      - "7912:8000"
    env_file: .env
    volumes:
      - ./spoolman/data/:/home/app/.local/share/spoolman/:rw
    networks:
      - creality-net

  timelapse:
    image: jrottenberg/ffmpeg:7.1-alpine
    container_name: timelapse
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command: >
      apk add --no-cache inotify-tools &&
      while true; do
        sleep 3600;
      done
    env_file: .env
    volumes:
      - timelapse_nfs:/data/:rw
    security_opt:
      - no-new-privileges:true
    networks:
      - creality-net

networks:
  creality-net:
    name: creality-net

volumes:
  timelapse_nfs:
    driver: local
    driver_opts:
      type: nfs
      o: "addr=192.168.20.42,rw,noatime,nfsvers=4,soft"
      device: ":/tank/printing/timelapse/"
